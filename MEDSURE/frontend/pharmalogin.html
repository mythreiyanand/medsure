<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedSure - Pharmacy Login</title>

    <link rel="stylesheet" href="pharmalogin.css">

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const loginForm = document.getElementById("login-form");
            const loginButton = document.querySelector(".login-btn");
            const errorMessage = document.getElementById("login-error");

            loginForm.addEventListener("submit", function (event) {
                event.preventDefault();

                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value.trim();

                // Demo login - no Firebase authentication
                if (email && password) {

                    loginButton.disabled = true;
                    loginButton.textContent = "Logging in...";

                    // Redirect to Pharmacy Dashboard
                    window.location.href = "pharmadash.html";

                } else {

                    errorMessage.textContent =
                        "Please enter your email and password.";

                }
            });

        });
    </script>
</head>

<body>

    <div class="login-container">

        <form class="login-form" id="login-form">

            <h2>Pharmacy Login</h2>

            <div class="input-group">
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="login-error" class="error-message"></p>

            <p>
                Don't have an account?
                <a href="signup.html"><u>Sign Up</u></a>
            </p>

        </form>

    </div>

</body>
</html>
